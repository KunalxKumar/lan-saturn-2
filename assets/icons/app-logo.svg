<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="saturn-grad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="48" y1="300" x2="464" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Back orbital ring -->
  <path d="M 96 292 C 58 260, 108 198, 256 172 C 404 146, 454 188, 416 220" stroke="url(#ring-grad)" stroke-width="18" stroke-linecap="round" opacity="0.45"/>
  <!-- Shield/Lock outer crest integrated into planet -->
  <path d="M 256 116 L 352 154 V 248 C 352 316, 308 364, 256 392 C 204 364, 160 316, 160 248 V 154 Z" stroke="url(#saturn-grad)" stroke-width="18" stroke-linejoin="round" fill="#0B0F19" fill-opacity="0.72" filter="url(#neon-glow)"/>
  <!-- Planet core -->
  <circle cx="256" cy="248" r="62" stroke="#22D3EE" stroke-width="14"/>
  <!-- Cryptographic keyhole inside planet -->
  <circle cx="256" cy="236" r="14" fill="#A855F7"/>
  <path d="M 248 246 L 264 246 L 268 278 L 244 278 Z" fill="#22D3EE"/>
  <!-- Front orbital ring crossing planet -->
  <path d="M 76 308 C 122 346, 224 334, 304 300 C 392 262, 444 218, 434 192" stroke="url(#ring-grad)" stroke-width="20" stroke-linecap="round" filter="url(#neon-glow)"/>
</svg>
